<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBJ Viewer - Project Structure</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="viewport">
        <div id="info">
            <h1>XBJ Viewer V1.0</h1>
            <p>Projekt-Struktur: HTML, CSS & JS getrennt.</p>
        </div>
    </div>

    <div id="editor-pane">
        <div id="editor-header">JSON Definition</div>
        <textarea id="json-input" spellcheck="false" placeholder="Lade JSON..."></textarea>
        <div id="error-console">System bereit.</div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
